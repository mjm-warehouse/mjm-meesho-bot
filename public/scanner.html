<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJM Warehouse Scanner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 30px 16px;
    background: #121212;
    color: #ffffff;
  }
  .card {
    background: #1e1e1e;
    border-radius: 14px;
    padding: 24px;
    margin: 20px auto;
    max-width: 380px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    border: 1px solid #333;
  }
  .step-badge {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .result-box {
    display: none;
    margin-top: 20px;
    background: #064e3b;
    border: 1px solid #10b981;
    border-radius: 10px;
    padding: 16px;
  }
  .result-text {
    font-size: 18px;
    font-weight: bold;
    color: #a7f3d0;
    word-break: break-all;
  }
  .manual-input {
    width: 85%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #fff;
    font-size: 16px;
    margin-top: 15px;
  }
  .btn-submit {
    margin-top: 12px;
    background: #10b981;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div class="card">
    <div id="stepBadge" class="step-badge">Warehouse Scanner</div>
    <h2 id="msg" style="margin: 8px 0; font-size: 20px;">Camera khul raha hai...</h2>
    <p id="guide" style="color: #aaa; font-size: 13px;">Barcode ko camera frame ke beech mein layein</p>

    <!-- Scan result confirmation popup -->
    <div id="resultBox" class="result-box">
      <div style="font-size: 12px; color: #6ee7b7; margin-bottom: 4px;">✅ SCANNED VALUE</div>
      <div id="scannedCode" class="result-text">---</div>
    </div>

    <!-- Fallback Manual Input -->
    <div id="manualSection" style="margin-top: 25px;">
      <input type="text" id="manualCode" class="manual-input" placeholder="Ya yahan manual code daalo">
      <br>
      <button class="btn-submit" onclick="submitManual()">Submit</button>
    </div>
  </div>

  <script>
    var tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    var params = new URLSearchParams(window.location.search);
    var step = params.get('step') || 'unknown';

    // Label customize karo step ke hisaab se
    var badge = document.getElementById('stepBadge');
    var guide = document.getElementById('guide');
    if (step === 'awb' || step === 'return_awb') {
      badge.innerText = 'Step 1/2: Scan Forward AWB';
      guide.innerText = 'Meesho label ke upar courier wala bada barcode scan karo';
    } else if (step === 'packet') {
      badge.innerText = 'Step 2/2: Scan Packet ID';
      guide.innerText = 'Chhota QR code ya Packet barcode scan karo';
    }

    // Audio Beep
    function playBeep() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function sendResult(text) {
      if (!text) return;
      playBeep();
      if (navigator.vibrate) navigator.vibrate(100);

      // Onscreen display show karo
      document.getElementById('msg').innerText = 'Code Scan Ho Gaya!';
      document.getElementById('scannedCode').innerText = text;
      document.getElementById('resultBox').style.display = 'block';

      // 800ms ka visual pause taaki user padh sake, phir bot ko bhej kar close karo
      setTimeout(function() {
        // Backend 'code' ya 'value' dono support karega
        tg.sendData(JSON.stringify({ code: text, value: text, step: step }));
        tg.close();
      }, 900);
    }

    function submitManual() {
      var val = document.getElementById('manualCode').value.trim();
      if (val) sendResult(val);
    }

    if (tg.showScanQrPopup) {
      document.getElementById('msg').innerText = 'Camera Ready';
      tg.showScanQrPopup({ text: step === 'awb' ? 'Scan Courier AWB' : 'Scan Packet ID/QR' }, function (text) {
        sendResult(text);
        return true;
      });
    } else {
      document.getElementById('msg').innerText = 'Manual Barcode Input';
      document.getElementById('guide').innerText = 'Scanner gun se input box mein scan karein ya type karein.';
    }
  </script>
</body>
</html>
